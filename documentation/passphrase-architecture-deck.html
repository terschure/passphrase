<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PASSPHRASE · Architecture Deck</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0a0a0a; --panel:#111111; --ink:#eeeeee; --muted:#888888; --dim:#666666;
    --line:#2a2a2a; --yellow:#facc15; --green:#22c55e; --red:#ef4444; --cyan:#8be9fd; --pink:#f472b6;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--mono);
    line-height:1.5; overflow:hidden; letter-spacing:0.01em;
  }
  /* faint scanlines echoing the game CRT feel */
  body::after{
    content:""; position:fixed; inset:0; z-index:60; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px);
    mix-blend-mode:screen; opacity:0.5;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column}
  /* top bar */
  header#bar{
    flex:none; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:12px 20px; border-bottom:1px solid var(--line);
    color:#fff; text-shadow:0 0 8px rgba(255,255,255,0.14);
  }
  #bar .brand{font-weight:700; letter-spacing:0.14em}
  #bar .brand b{color:var(--yellow)}
  #bar .section-tag{justify-self:center; color:var(--muted); font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase}
  #bar .counter{justify-self:end; display:flex; align-items:center; gap:12px; color:var(--dim); font-size:0.82rem}
  #bar .counter b{color:var(--ink)}
  #pdf-btn{font:inherit; font-size:0.7rem; letter-spacing:0.06em; color:var(--dim); background:transparent;
           border:1px solid var(--line); border-radius:5px; padding:3px 9px; cursor:pointer;
           transition:color 150ms, border-color 150ms}
  #pdf-btn:hover{color:var(--yellow); border-color:var(--yellow)}
  #pdf-btn:disabled{opacity:0.55; cursor:default; border-color:var(--line); color:var(--dim)}
  /* stage */
  #stage{flex:1; min-height:0; position:relative; overflow:hidden}
  .slide{
    position:absolute; inset:0; padding:min(6vh,54px) min(7vw,90px);
    overflow-y:auto; animation:fade 260ms ease both;
  }
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .slide-inner{max-width:1180px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; justify-content:center}
  /* progress rail */
  #rail{flex:none; display:flex; gap:3px; padding:6px 20px 10px; border-top:1px solid var(--line); overflow-x:auto}
  #rail .seg{flex:1; min-width:8px; height:4px; border-radius:2px; background:#222; cursor:pointer; transition:background 150ms}
  #rail .seg.done{background:#3a3a2a}
  #rail .seg.here{background:var(--yellow)}
  /* typography */
  h1{font-size:clamp(2rem,6vw,4.4rem); margin:0 0 .2em; letter-spacing:0.05em;
     text-shadow:1px 0 0 rgba(239,68,68,.5),-1px 0 0 rgba(255,255,255,.28),0 0 26px rgba(255,255,255,.14)}
  h2{font-size:clamp(1.3rem,3.4vw,2.3rem); margin:0 0 .5em; color:#fff; letter-spacing:0.03em}
  h3{font-size:1rem; color:var(--yellow); text-transform:uppercase; letter-spacing:0.1em; margin:0 0 .6em}
  p{margin:0 0 .8em; color:#dcdcdc; font-size:clamp(.92rem,1.5vw,1.08rem)}
  .lead{font-size:clamp(1rem,1.9vw,1.3rem); color:#eaeaea}
  .kicker{color:var(--yellow); letter-spacing:0.18em; text-transform:uppercase; font-size:.8rem; margin-bottom:1.2em}
  .muted{color:var(--muted)} .dim{color:var(--dim)}
  code, .chip{font-family:var(--mono)}
  code{color:var(--cyan)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:.2em 0 0}
  .chip{border:1px solid #334; background:rgba(139,233,253,.06); color:var(--cyan);
        padding:2px 8px; border-radius:5px; font-size:.82rem}
  ul.ticks{list-style:none; padding:0; margin:.2em 0}
  ul.ticks li{position:relative; padding-left:1.3em; margin:.35em 0; color:#dcdcdc}
  ul.ticks li::before{content:"›"; position:absolute; left:0; color:var(--yellow); font-weight:700}
  /* plain-terms callout */
  .plain{border-left:3px solid var(--yellow); background:rgba(250,204,21,.06);
         padding:.7em 1em; border-radius:0 6px 6px 0; margin:.2em 0 0}
  .plain .lbl{display:block; color:var(--yellow); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; margin-bottom:.25em}
  .plain p{margin:0; color:#f3eccf}
  /* file slide layout */
  .file-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:.2em}
  .path{font-size:clamp(1.05rem,2.4vw,1.7rem); color:#fff; font-weight:700}
  .path .dir{color:var(--dim)}
  .path .name{color:var(--yellow)}
  .badge{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:4px; border:1px solid}
  .badge.pure{color:var(--green); border-color:#1c4}
  .badge.service{color:var(--cyan); border-color:#268}
  .badge.ui{color:var(--pink); border-color:#835}
  .badge.data{color:#c4b5fd; border-color:#549}
  .badge.shell{color:#fca; border-color:#853}
  .badge.coord{color:var(--yellow); border-color:#872}
  .sub-tag{color:var(--muted); font-size:.78rem}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:22px 34px; margin-top:.4em}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .connects{margin-top:1em; color:var(--muted); font-size:.9rem}
  .connects b{color:#cfcfcf; font-weight:600}
  .connects code{color:var(--green)}
  /* section divider */
  .section-hero .num{color:var(--dim); letter-spacing:.2em}
  .filelist{display:flex; flex-wrap:wrap; gap:8px; margin-top:1em}
  .filelist .f{border:1px solid var(--line); border-radius:5px; padding:4px 10px; color:#cfcfcf; font-size:.85rem; background:#141414}
  .filelist .f b{color:var(--yellow)}
  .deepdive{margin-top:1.1em; border:1px solid var(--line); border-radius:8px; padding:1em 1.2em; background:#0e0e0e}
  .deepdive h3{color:var(--cyan)}
  /* diagrams */
  pre.ascii{font-family:var(--mono); white-space:pre; overflow-x:auto; color:#cfe; background:#0d0d0d;
            border:1px solid var(--line); border-radius:8px; padding:1em 1.2em; font-size:clamp(.62rem,1.15vw,.9rem); line-height:1.35}
  .flow{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:.6em 0}
  .flow .node{border:1px solid #334; background:#111; border-radius:7px; padding:8px 12px; font-size:.86rem}
  .flow .node b{color:var(--yellow)} .flow .node span{color:var(--muted); display:block; font-size:.72rem}
  .flow .arr{color:var(--dim)}
  /* architecture map */
  .map{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:.6em}
  @media(max-width:860px){.map{grid-template-columns:repeat(2,1fr)}}
  .box{border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:#101010; cursor:pointer;
       transition:border-color 150ms, transform 150ms, background 150ms}
  .box:hover{border-color:var(--yellow); transform:translateY(-2px); background:#151510}
  .box .t{color:#fff; font-weight:700; letter-spacing:.03em}
  .box .c{color:var(--dim); font-size:.72rem}
  .box .d{color:var(--muted); font-size:.82rem; margin-top:.25em}
  .box.wide{grid-column:1/-1; background:#0e0e0f}
  .box.coordbox{border-color:#7a5f12; background:#14120a}
  /* title waveform */
  #wave{color:rgba(250,204,21,.5); white-space:pre; font-size:clamp(.5rem,1.1vw,.85rem); line-height:1;
        margin:1.4em 0 0; text-shadow:0 0 10px rgba(250,204,21,.25); pointer-events:none; overflow:hidden}
  .title-meta{margin-top:1.6em; color:var(--muted)}
  .title-meta b{color:var(--ink)}
  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:.6em}
  .legend .item{display:flex; align-items:center; gap:8px; font-size:.86rem; color:#cfcfcf}
  .keys{display:inline-block; border:1px solid var(--line); border-radius:5px; padding:1px 7px; color:#fff; background:#141414; font-size:.8rem}
  /* TOC overlay */
  #toc{position:fixed; inset:0; z-index:80; background:rgba(6,6,6,.94); display:none; padding:5vh 6vw; overflow-y:auto}
  #toc.open{display:block}
  #toc h2{color:var(--yellow)}
  #toc .cols{columns:2; column-gap:40px}
  @media(max-width:760px){#toc .cols{columns:1}}
  #toc a{display:block; color:#cfcfcf; text-decoration:none; padding:4px 0; break-inside:avoid; border-bottom:1px solid #191919}
  #toc a:hover{color:var(--yellow)}
  #toc a .n{color:var(--dim); margin-right:.6em}
  #toc .hint{color:var(--dim); margin-top:1em}
  /* nav buttons */
  .nav-btn{position:fixed; top:50%; transform:translateY(-50%); z-index:40; background:transparent; border:0;
           color:#333; font-size:2.4rem; cursor:pointer; padding:0 14px; transition:color 150ms}
  .nav-btn:hover{color:var(--yellow)}
  #prev{left:2px} #next{right:2px}
  .cover-badge{display:inline-block; border:1px solid var(--green); color:var(--green); border-radius:5px;
               padding:3px 10px; font-size:.85rem; margin-top:.4em}
  .hintbar{position:fixed; bottom:56px; left:50%; transform:translateX(-50%); z-index:30; color:var(--dim);
           font-size:.72rem; letter-spacing:.06em; opacity:.7}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand"><b>▮</b> PASSPHRASE <span class="dim">/ architecture</span></div>
    <div class="section-tag" id="sectionTag"></div>
    <div class="counter"><button id="pdf-btn" type="button" title="Download every slide as a PDF (one page per slide)">⤓ PDF</button><span><b id="cur">1</b> / <span id="total">1</span></span></div>
  </header>
  <div id="stage"></div>
  <div id="rail"></div>
</div>
<button class="nav-btn" id="prev" aria-label="Previous">‹</button>
<button class="nav-btn" id="next" aria-label="Next">›</button>
<div class="hintbar">← → navigate · <span class="keys">T</span> contents · <span class="keys">Home/End</span> jump</div>
<div id="toc"><h2>Contents</h2><div class="cols" id="tocList"></div><div class="hint">Press <span class="keys">T</span> or <span class="keys">Esc</span> to close · click any entry to jump.</div></div>

       does:["Imports the real modules, feeds them mock DOM/streams/timers, and asserts behavior with node:assert — no framework, no browser.",

    name:"Entry & Coordinator", tag:"coord",
    purpose:"The bootstrap and the single conductor that wires every subsystem together.",
    plain:"The on-switch and the orchestra conductor — nothing plays until, and unless, this says so.",
    deepDive:{title:"The coordinator pattern",
      body:"passphraseApp.js is the only place allowed to cross subsystem boundaries. It owns the mutable game state (level, word index, deadline, lives) and calls pure helpers with plain-data snapshots (createRuleStateSnapshot / applyRuleState), then triggers side effects — sound, DOM, echo, talk-back — itself. Runtime services never import one another; they receive callbacks and getters. That is why the whole thing stays testable and refactorable."},

function runCoverageCheck(){
  const fileSlidePaths = SLIDES.filter(s=>s.type==="file").map(s=>s.file.path.replace(/^src\//,"src/"));
  // normalize: file slides store full-ish paths already
  const present = SLIDES.filter(s=>s.type==="file").map(s=>s.file.path);
  const norm = p => p; // paths already match EXPECTED form
  const missing = EXPECTED.filter(e=>!present.some(p=>norm(p)===e));
  const extra = present.filter(p=>!EXPECTED.includes(p));
  const dupes = present.filter((p,i)=>present.indexOf(p)!==i);
  const ok = missing.length===0 && extra.length===0 && dupes.length===0;
  const line = `coverage: ${present.length}/${EXPECTED.length} ${ok?"✓":"✗"}`;
  if(ok){ console.log("%c[deck] "+line,"color:#22c55e"); }
  else {
    console.warn("[deck] "+line);
    if(missing.length) console.warn("  missing slides for:", missing);
    if(extra.length)   console.warn("  unexpected slides:", extra);
    if(dupes.length)   console.warn("  duplicate slides:", dupes);
  }
  return {ok,line,count:present.length,total:EXPECTED.length,missing,extra,dupes};
}

}

function navLabel(s){
  if(s.type==="title") return "Title";
  if(s.type==="map") return s.nav||"Architecture map";
  if(s.type==="content") return s.nav||"—";
  if(s.type==="section") return s.section.name+" · overview";
  if(s.type==="file") return s.file.path;
  return "—";
}
function sectionOf(s){
  if(s.type==="section") return s.section.name;
  if(s.type==="file") return s.section.name;
  return "";
}

let waveTimer=null;
function render(){
  const s=SLIDES[idx];
  const div=document.createElement("div");
  div.className="slide";
  div.innerHTML=slideHtml(s);
  stage.replaceChildren(div);
  // wire clickable boxes
  div.querySelectorAll("[data-goto]").forEach(b=>{
    b.addEventListener("click",()=>{const t=parseInt(b.getAttribute("data-goto"),10); if(t>=0) go(t);});
  });
  // coverage badge on recap
  const badge=div.querySelector("#coverBadge");
  if(badge){ badge.textContent=COVERAGE.line; badge.style.borderColor=COVERAGE.ok?"var(--green)":"var(--red)"; badge.style.color=COVERAGE.ok?"var(--green)":"var(--red)"; }
  // title waveform animation
  if(waveTimer){cancelAnimationFrame(waveTimer); waveTimer=null;}
  const wave=div.querySelector("#wave");
  if(wave) startWave(wave);
  // chrome
  curEl.textContent=String(idx+1);
  totalEl.textContent=String(SLIDES.length);
  sectionTagEl.textContent=sectionOf(s);
  hintbarEl.style.display = idx===0 ? "block" : "none"; // avoid overlapping dense slides
  buildRail();
  history.replaceState(null,"", "#"+(idx+1));
}
function go(n){ idx=Math.max(0,Math.min(SLIDES.length-1,n)); render(); }
function next(){ if(idx<SLIDES.length-1) go(idx+1); }
function prev(){ if(idx>0) go(idx-1); }

function buildRail(){
  railEl.replaceChildren();
  SLIDES.forEach((s,i)=>{
    const seg=document.createElement("div");
    seg.className="seg"+(i<idx?" done":"")+(i===idx?" here":"");
    seg.title=(i+1)+". "+navLabel(s);
    seg.addEventListener("click",()=>go(i));
    railEl.appendChild(seg);
  });
}

/* title-slide ASCII waveform: three summed sines, gentle motion */
function startWave(el){
  const cols=90, rows=7;
  let t=0;
  function frame(){
    t+=0.06;
    const mid=(rows-1)/2;
    const grid=Array.from({length:rows},()=>new Array(cols).fill(" "));
    for(let x=0;x<cols;x++){
      const v=Math.sin(x*0.19+t)*0.6+Math.sin(x*0.47+t*1.3)*0.28+Math.sin(x*0.91+t*0.7)*0.16;
      const peak=Math.round(mid - v*mid*0.9);
      for(let y=0;y<rows;y++){
        if(y===peak) grid[y][x]= (x%5===0)?"^":"/";
        else if(y>peak && y<=mid) grid[y][x]="|";
        else if(y===Math.round(mid)) grid[y][x]="_";
      }
    }
    el.textContent=grid.map(r=>r.join("")).join("\n");
    waveTimer=requestAnimationFrame(frame);
  }
  frame();
}

/* ---- TOC overlay ---- */
const toc=document.getElementById("toc");
const tocList=document.getElementById("tocList");
function buildToc(){
  tocList.replaceChildren();
  SLIDES.forEach((s,i)=>{
    if(!(s.type==="section" || s.type==="title" || (s.type==="content"&&s.nav) || s.type==="map" || s.type==="file" && false)) {
      // include section dividers + key narrative slides only (keep TOC scannable)
    }
    const isEntry = s.type==="section" || s.type==="title" || s.type==="map" || (s.type==="content" && s.nav);
    if(!isEntry) return;
    const a=document.createElement("a");
    a.href="#"+(i+1);
    a.innerHTML=`<span class="n">${String(i+1).padStart(2,"0")}</span>${esc(navLabel(s))}`;
    a.addEventListener("click",e=>{e.preventDefault(); toc.classList.remove("open"); go(i);});
    tocList.appendChild(a);
  });
}
function toggleToc(){ toc.classList.toggle("open"); if(toc.classList.contains("open")) buildToc(); }

/* ---- input ---- */
document.getElementById("next").addEventListener("click",next);
document.getElementById("prev").addEventListener("click",prev);
window.addEventListener("keydown",e=>{
  if(toc.classList.contains("open")){
    if(e.key==="Escape"||e.key.toLowerCase()==="t"){e.preventDefault(); toc.classList.remove("open");}
    return;
  }
  switch(e.key){
    case "ArrowRight": case "PageDown": case " ": e.preventDefault(); next(); break;
    case "ArrowLeft": case "PageUp": e.preventDefault(); prev(); break;
    case "Home": e.preventDefault(); go(0); break;
    case "End": e.preventDefault(); go(SLIDES.length-1); break;
    case "t": case "T": e.preventDefault(); toggleToc(); break;
    case "Escape": e.preventDefault(); toggleToc(); break;
  }
});

/* live hash edits navigate (go() uses replaceState, which does NOT fire this) */
window.addEventListener("hashchange",()=>{
  const h=parseInt((location.hash||"").replace("#",""),10);
  if(!isNaN(h)&&h>=1&&h<=SLIDES.length&&h-1!==idx) go(h-1);
});

/* ============================================================================
   EXPORT TO PDF — fully in-browser, no dependencies.
   Each slide is rendered to an image via an SVG <foreignObject> snapshot, then
   the images are assembled into a minimal PDF (one page per slide).
   ==========================================================================*/
const PDF_PAGE_W = 1280, PDF_PAGE_H = 800, PDF_SCALE = 2;

function collectDeckCss(){
  return [...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
}
function collectRootVars(){
  const cs = getComputedStyle(document.documentElement);
  return ["--bg","--panel","--ink","--muted","--dim","--line","--yellow","--green","--red","--cyan","--pink","--mono"]
    .map(n=>`${n}:${cs.getPropertyValue(n).trim()}`).join(";");
}
function base64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

// Build an SVG snapshot of slide `i` (HTML rendered inside a foreignObject).
function buildSlideSvg(i){
  const cap = document.createElement("div");
  cap.setAttribute("style",
    `width:${PDF_PAGE_W}px;height:${PDF_PAGE_H}px;padding:46px 90px;overflow:hidden;`+
    `box-sizing:border-box;background:#0a0a0a;`);
  cap.innerHTML = slideHtml(SLIDES[i]);
  // Serialize as XHTML so it is valid inside the SVG foreignObject.
  const inner = new XMLSerializer().serializeToString(cap);
  const css = collectDeckCss() + "\n*{animation:none!important;transition:none!important}";
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${PDF_PAGE_W}" height="${PDF_PAGE_H}">`+
    `<foreignObject x="0" y="0" width="${PDF_PAGE_W}" height="${PDF_PAGE_H}">`+
    `<div xmlns="http://www.w3.org/1999/xhtml" style='${collectRootVars()};`+
    `width:${PDF_PAGE_W}px;height:${PDF_PAGE_H}px;background:#0a0a0a;color:#eeeeee;`+
    `font-family:var(--mono);line-height:1.5;'>`+
    `<style>${css}</style>${inner}</div></foreignObject></svg>`;
}

// Render slide `i` to a JPEG (Uint8Array) at the fixed page size.
async function slideToImage(i){
  const svg = buildSlideSvg(i);
  const img = new Image();
  await new Promise((res,rej)=>{
    img.onload=res; img.onerror=()=>rej(new Error("slide render failed"));
    img.src = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });

  const canvas = document.createElement("canvas");
  canvas.width = PDF_PAGE_W*PDF_SCALE;
  canvas.height = PDF_PAGE_H*PDF_SCALE;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle="#0a0a0a";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(PDF_SCALE,0,0,PDF_SCALE,0,0);
  ctx.drawImage(img,0,0,PDF_PAGE_W,PDF_PAGE_H);

  const dataUrl = canvas.toDataURL("image/jpeg",0.82);
  return { jpeg: base64ToBytes(dataUrl.split(",")[1]), iw: canvas.width, ih: canvas.height };
}

// Assemble JPEG pages into a minimal PDF (Uint8Array). One image per page.
function buildPdf(pages){
  const enc = new TextEncoder();
  const chunks = []; let offset = 0; const offsets = [];
  const put = (data)=>{ const u = typeof data==="string"?enc.encode(data):data; chunks.push(u); offset+=u.length; };
  const obj = (n)=>{ offsets[n]=offset; };

  put("%PDF-1.3\n");
  const N = pages.length;
  const kids = [];
  for(let p=0;p<N;p++) kids.push(`${5+p*3} 0 R`);

  obj(1); put(`1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`);
  obj(2); put(`2 0 obj\n<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${N} >>\nendobj\n`);

  for(let p=0;p<N;p++){
    const { jpeg, iw, ih } = pages[p];
    const imgNo=3+p*3, contentNo=4+p*3, pageNo=5+p*3;
    obj(imgNo);
    put(`${imgNo} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
    put(jpeg);
    put(`\nendstream\nendobj\n`);
    const content = `q ${PDF_PAGE_W} 0 0 ${PDF_PAGE_H} 0 0 cm /Im0 Do Q\n`;
    obj(contentNo);
    put(`${contentNo} 0 obj\n<< /Length ${enc.encode(content).length} >>\nstream\n${content}endstream\nendobj\n`);
    obj(pageNo);
    put(`${pageNo} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PDF_PAGE_W} ${PDF_PAGE_H}] /Resources << /XObject << /Im0 ${imgNo} 0 R >> >> /Contents ${contentNo} 0 R >>\nendobj\n`);
  }

  const total = 2 + N*3;
  const xrefStart = offset;
  let xref = `xref\n0 ${total+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=total;n++) xref += String(offsets[n]).padStart(10,"0")+" 00000 n \n";
  put(xref);
  put(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);

  let len=0; for(const c of chunks) len+=c.length;
  const out = new Uint8Array(len); let o=0;
  for(const c of chunks){ out.set(c,o); o+=c.length; }
  return out;
}

async function generateDeckPdf({ download=true, limit=SLIDES.length, onProgress }={}){
  const count = Math.min(limit, SLIDES.length);
  const pages = [];
  for(let i=0;i<count;i++){
    pages.push(await slideToImage(i));
    if(onProgress) onProgress(i+1, count);
    await new Promise(r=>setTimeout(r,0)); // yield so the UI can update
  }
  const pdf = buildPdf(pages);
  if(download){
    const url = URL.createObjectURL(new Blob([pdf],{type:"application/pdf"}));
    const a = document.createElement("a");
    a.href=url; a.download="passphrase-architecture-deck.pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
  return pdf;
}
window.generateDeckPdf = generateDeckPdf; // also usable from the console

const pdfBtn = document.getElementById("pdf-btn");
pdfBtn.addEventListener("click", async ()=>{
  const label = pdfBtn.textContent;
  pdfBtn.disabled = true;
  try{
    await generateDeckPdf({ onProgress:(done,total)=>{ pdfBtn.textContent = `PDF ${done}/${total}`; } });
    pdfBtn.textContent = "✓ PDF";
    setTimeout(()=>{ pdfBtn.textContent = label; }, 1500);
  }catch(err){
    console.error("[deck] PDF export failed", err);
    pdfBtn.textContent = "PDF failed";
    setTimeout(()=>{ pdfBtn.textContent = label; }, 2000);
  }finally{
    pdfBtn.disabled = false;
  }
});

/* start at hash if present */
(function init(){
  const h=parseInt((location.hash||"").replace("#",""),10);
  if(!isNaN(h)&&h>=1&&h<=SLIDES.length) idx=h-1;
  render();
})();
</script>
