<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Road Talk Configurable</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
                    monospace;
                background: #0a0a0a;
                color: #eeeeee;
            }

            body {
                min-height: 100vh;
                max-width: none;
                margin: 0 auto;
                padding: 0;
                line-height: 1.35;
                background: #0a0a0a;
                overflow: hidden;
            }

            h1 {
                position: fixed;
                top: 14px;
                left: 50%;
                z-index: 3;
                transform: translateX(-50%);
                font-size: 1.35rem;
                margin: 0;
                font-weight: 700;
                color: #facc15;
                letter-spacing: 0.08em;
                text-align: center;
                text-shadow: 0 2px 12px #000000;
            }

            .controls {
                position: fixed;
                top: 54px;
                left: 50%;
                z-index: 3;
                transform: translateX(-50%);
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                justify-content: center;
                width: min(94vw, 480px);
            }

            #open-settings {
                position: fixed;
                top: 10px;
                right: 10px;
                z-index: 4;
                padding: 3px 7px;
                border: 1px solid #333333;
                border-radius: 5px;
                background: rgba(32, 32, 32, 0.72);
                color: #777777;
                font-size: 0.72rem;
                font-weight: 400;
            }

            #open-settings:hover {
                color: #aaaaaa;
                background: rgba(48, 48, 48, 0.9);
            }

            main {
                display: block;
            }

            #game {
                width: 100%;
                min-height: 100vh;
                background: #111111;
                user-select: none;
            }

            button {
                font: inherit;
                padding: 6px 12px;
                border: 0;
                border-radius: 8px;
                cursor: pointer;
                background: #facc15;
                color: #111111;
                font-weight: 700;
            }

            button:disabled {
                cursor: not-allowed;
                opacity: 0.35;
            }

            #status {
                position: fixed;
                top: 96px;
                left: 50%;
                z-index: 3;
                transform: translateX(-50%);
                min-height: 1.35em;
                color: #aaaaaa;
                text-align: center;
                text-shadow: 0 2px 8px #000000;
            }

            #visualizer {
                position: fixed;
                right: 14px;
                bottom: 92px;
                z-index: 3;
                display: block;
                width: min(300px, 42vw);
                height: 52px;
                border-radius: 6px;
                background: rgba(17, 17, 17, 0.78);
            }

            #transcript {
                position: fixed;
                left: 50%;
                bottom: 14px;
                z-index: 3;
                transform: translateX(-50%);
                width: min(420px, calc(100vw - 28px));
                min-height: 56px;
                padding: 8px 14px;
                border: 1px solid #333333;
                border-radius: 8px;
                background: rgba(26, 26, 26, 0.86);
                color: #aaaaaa;
                font-size: 0.95rem;
                font-style: italic;
                white-space: normal;
                overflow-wrap: anywhere;
            }

            #transcript .hit {
                color: #facc15;
                font-weight: 700;
            }

            #echo-panel {
                position: fixed;
                top: 90px;
                left: 14px;
                z-index: 3;
                display: none;
                width: 200px;
                padding: 8px 10px;
                border: 1px solid #333333;
                border-radius: 8px;
                background: rgba(17, 17, 17, 0.78);
                color: #aaaaaa;
                font-size: 0.7rem;
            }

            #echo-panel.visible {
                display: block;
            }

            #echo-rows {
                max-height: calc(100vh - 220px);
                overflow-y: auto;
            }

            .echo-header {
                color: #facc15;
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.08em;
            }

            .echo-row {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-top: 4px;
            }

            .echo-row canvas {
                flex: none;
                width: 64px;
                height: 16px;
            }

            .echo-label {
                flex: 1;
                overflow: hidden;
                color: #888888;
                font-style: italic;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            .echo-badge {
                flex: none;
                font-size: 0.65rem;
                letter-spacing: 0.06em;
            }

            .echo-badge.rec {
                color: #ef4444;
            }

            .echo-badge.init {
                color: #facc15;
            }

            .echo-badge.play {
                color: #facc15;
                font-weight: 700;
            }

            #settings-backdrop {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: none;
                background: rgba(0, 0, 0, 0.58);
            }

            #settings-backdrop.open {
                display: block;
            }

            #settings-panel {
                position: fixed;
                inset: 0 0 0 auto;
                z-index: 11;
                width: min(360px, 88vw);
                padding: 16px;
                border-left: 1px solid #333333;
                background: #0d0d0d;
                color: #aaaaaa;
                overflow-y: auto;
                transform: translateX(100%);
                transition: transform 180ms ease;
            }

            #settings-panel.open {
                transform: translateX(0);
            }

            .settings-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                color: #facc15;
                font-weight: 700;
            }

            label {
                display: block;
                margin: 10px 0 4px;
                color: #666666;
                font-size: 0.75rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            textarea,
            select,
            input {
                box-sizing: border-box;
                width: 100%;
                font: inherit;
                padding: 6px 8px;
                border: 1px solid #333333;
                border-radius: 6px;
                background: #1a1a1a;
                color: #eeeeee;
            }

            textarea {
                min-height: 120px;
                resize: vertical;
            }

            ul {
                list-style: none;
                padding: 0;
                margin: 10px 0 0;
            }

            li {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            li.current {
                font-weight: 700;
                color: #facc15;
            }

            li.checked {
                text-decoration: line-through;
                opacity: 0.7;
            }

            li.failed {
                color: #ffffff;
                text-decoration: underline;
            }

            input[type="checkbox"] {
                width: auto;
            }

            .sequence-panel {
                margin-top: 10px;
            }

            #sequence-status {
                min-height: 4em;
                margin-top: 8px;
                white-space: pre-wrap;
            }

            .timeline-panel {
                position: fixed;
                inset: 0;
                z-index: 1;
                background: #111111;
                overflow: hidden;
            }

            .timeline-header {
                position: fixed;
                top: 12px;
                left: 14px;
                z-index: 3;
                display: flex;
                justify-content: space-between;
                gap: 12px;
                color: #aaaaaa;
                font-size: 0.8rem;
                text-shadow: 0 2px 8px #000000;
            }

            #timer-display {
                position: fixed;
                top: 120px;
                left: 50%;
                z-index: 3;
                transform: translateX(-50%);
                font-size: 2.4rem;
                line-height: 1;
                color: #facc15;
                text-align: center;
                text-shadow: 0 2px 8px #000000;
            }

            #lives-display {
                position: fixed;
                top: 166px;
                left: 50%;
                z-index: 3;
                transform: translateX(-50%);
                font-size: 1.4rem;
                font-weight: 700;
                letter-spacing: 0.14em;
                white-space: nowrap;
                text-align: center;
                text-shadow: 0 2px 8px #000000;
            }

            #lives-display .hearts {
                color: #ef4444;
            }

            #lives-display .retries {
                color: #facc15;
                font-size: 0.85rem;
                letter-spacing: 0.08em;
            }

            #timeline {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 50%;
                z-index: 1;
                width: max-content;
                height: 100vh;
                margin: 0;
                overflow: hidden;
                transform: translateX(-50%);
                white-space: pre;
                color: #dddddd;
                font-size: clamp(11px, 1.65vw, 18px);
                line-height: 1.08;
                letter-spacing: 0.04em;
            }

            .muted {
                color: #666666;
            }

            .ground {
                color: #444444;
            }

            .gate-0 {
                color: #22c55e;
            }

            .gate-1 {
                color: #8be9fd;
            }

            .gate-2 {
                color: #facc15;
            }

            .gate-3 {
                color: #f472b6;
            }

            .ok {
                color: #22c55e;
            }

            .warn {
                color: #facc15;
            }

            .bad {
                color: #ef4444;
            }

            @media (max-width: 760px) {
                #visualizer {
                    left: 14px;
                    right: auto;
                    width: calc(100vw - 28px);
                    bottom: 88px;
                }

                #echo-panel,
                #echo-panel.visible {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="game">
            <h1>&#9650; ROAD TALK &#9650;</h1>
            <main>
                <section>
                <div class="controls">
                    <button id="start">START</button>
                    <button id="stop" disabled>STOP</button>
                    <button id="clear">CLEAR</button>
                </div>
                <button id="open-settings" type="button">settings</button>

                <div id="status">Idle</div>
                <div class="timeline-panel" aria-live="polite">
                    <div class="timeline-header">
                        <span>ROAD</span>
                        <span id="timeline-state">mode: lives</span>
                    </div>
                    <pre id="timeline">//////////////////////////////////////////
//////////////////////////////////////////
//////////////////////////////////////////</pre>
                    <div id="timer-display">--.-</div>
                    <div id="lives-display"></div>
                </div>
                <div id="echo-panel" aria-live="polite">
                    <div class="echo-header">[ echo ]</div>
                    <div id="echo-rows"></div>
                </div>
                <canvas
                    id="visualizer"
                    width="900"
                    height="120"
                    aria-label="Microphone audio visualizer"
                ></canvas>
                <div id="transcript" aria-live="polite"><span id="final"></span><span id="interim"></span></div>
                </section>

            </main>
        </div>

        <div id="settings-backdrop"></div>
        <aside id="settings-panel" aria-hidden="true">
                <div class="settings-header">
                    <span>[ settings ]</span>
                    <button id="close-settings" type="button">CLOSE</button>
                </div>
                <label for="mode">mode</label>
                <select id="mode">
                    <option value="catch">catch any word</option>
                    <option value="sequence">sequence timer</option>
                    <option value="rhythm">rhythm (fixed beat)</option>
                    <option value="lives" selected>lives &amp; retries</option>
                </select>

                <label for="seconds">seconds for next word</label>
                <input
                    id="seconds"
                    type="number"
                    min="1"
                    max="60"
                    step="1"
                    value="5"
                />

                <label for="lives">lives (lives mode)</label>
                <input
                    id="lives"
                    type="number"
                    min="1"
                    max="9"
                    step="1"
                    value="3"
                />

                <label for="retries">retries per word (lives mode)</label>
                <input
                    id="retries"
                    type="number"
                    min="0"
                    max="9"
                    step="1"
                    value="2"
                />

                <label for="transcript-source">transcript source</label>
                <select id="transcript-source">
                    <option value="interim">unstable interim</option>
                    <option value="final">final results only</option>
                </select>

                <label for="echo-mode">echo interference</label>
                <select id="echo-mode">
                    <option value="off">off</option>
                    <option value="random">random moments</option>
                    <option value="key">key moments</option>
                    <option value="both" selected>
                        random + key moments
                    </option>
                </select>

                <div class="sequence-panel">
                    <button id="reset-sequence">[ reset seq ]</button>
                    <div id="sequence-status">sequence: waiting</div>
                </div>

                <label for="words">one word or phrase per line</label>
                <textarea id="words" aria-label="Words to catch">
hello
test
microphone
banana
purple
window
tiger
coffee
mountain
seven
river
guitar</textarea
                >
                <ul id="word-list" aria-label="Caught words"></ul>
        </aside>

        <script>
            const SpeechRecognition =
                window.SpeechRecognition || window.webkitSpeechRecognition;
            const startButton = document.querySelector("#start");
            const stopButton = document.querySelector("#stop");
            const clearButton = document.querySelector("#clear");
            const openSettingsButton = document.querySelector("#open-settings");
            const closeSettingsButton =
                document.querySelector("#close-settings");
            const settingsBackdrop =
                document.querySelector("#settings-backdrop");
            const settingsPanel = document.querySelector("#settings-panel");
            const resetSequenceButton =
                document.querySelector("#reset-sequence");
            const modeInput = document.querySelector("#mode");
            const secondsInput = document.querySelector("#seconds");
            const livesInput = document.querySelector("#lives");
            const retriesInput = document.querySelector("#retries");
            const transcriptSourceInput =
                document.querySelector("#transcript-source");
            const echoModeInput = document.querySelector("#echo-mode");
            const echoPanel = document.querySelector("#echo-panel");
            const echoHeader = document.querySelector(
                "#echo-panel .echo-header",
            );
            const echoRows = document.querySelector("#echo-rows");
            const wordsInput = document.querySelector("#words");
            const wordList = document.querySelector("#word-list");
            const sequenceStatus = document.querySelector("#sequence-status");
            const timelineState = document.querySelector("#timeline-state");
            const timerDisplay = document.querySelector("#timer-display");
            const livesDisplay = document.querySelector("#lives-display");
            const timeline = document.querySelector("#timeline");
            const status = document.querySelector("#status");
            const finalText = document.querySelector("#final");
            const interimText = document.querySelector("#interim");
            const visualizer = document.querySelector("#visualizer");
            const canvas = visualizer.getContext("2d");
            const finalChunks = [];
            const caughtWords = new Set();
            let interimTranscript = "";
            let sequenceIndex = 0;
            let sequenceFailed = false;
            let failReason = "timeout";
            let deadline = null;
            let timerInterval = null;
            let livesLeft = 3;
            let retriesLeft = 2;
            let wordCaughtThisBeat = false;
            let gateOpenedAt = 0;
            const echoSnippets = [];
            const activeEchoes = new Set();
            let echoRecorder = null;
            let echoRecorderStartedAt = 0;
            let echoBus = null;
            let lastEchoAt = 0;
            let wallEchoFiredThisBeat = false;
            let echoRandomInterval = null;
            let echoIdCounter = 0;
            let audioContext;
            let analyser;
            let micStream;
            let visualizerFrame;
            let roadAnimationFrame;
            let lastRoadRender = 0;
            function getRoadMetrics() {
                const styles = getComputedStyle(timeline);
                const fontSize = parseFloat(styles.fontSize) || 14;
                const lineHeight = parseFloat(styles.lineHeight) || fontSize * 1.08;
                const letterSpacing =
                    parseFloat(styles.letterSpacing) || 0;
                const measurer =
                    getRoadMetrics.measurer ||
                    (getRoadMetrics.measurer = document.createElement("canvas"));
                const context = measurer.getContext("2d");
                context.font = `${styles.fontWeight} ${fontSize}px ${styles.fontFamily}`;
                const charWidth =
                    context.measureText("M").width + letterSpacing;
                const width = Math.max(
                    42,
                    Math.ceil(window.innerWidth / charWidth) + 12,
                );
                const height = Math.max(
                    24,
                    Math.ceil(window.innerHeight / lineHeight) + 2,
                );
                const center = Math.floor(width / 2);
                const laneHalfWidth = Math.max(
                    9,
                    Math.min(18, Math.floor(width * 0.16)),
                );

                return {
                    width,
                    height,
                    laneLeft: center - laneHalfWidth,
                    laneRight: center + laneHalfWidth,
                    carCol: center - 2,
                    carRow: height - 5,
                };
            }

            function openSettings() {
                settingsBackdrop.classList.add("open");
                settingsPanel.classList.add("open");
                settingsPanel.setAttribute("aria-hidden", "false");
            }

            function closeSettings() {
                settingsBackdrop.classList.remove("open");
                settingsPanel.classList.remove("open");
                settingsPanel.setAttribute("aria-hidden", "true");
            }

            function startRoadAnimation() {
                if (roadAnimationFrame) {
                    return;
                }

                function frame(timestamp) {
                    roadAnimationFrame = requestAnimationFrame(frame);

                    if (timestamp - lastRoadRender < 90) {
                        return;
                    }

                    lastRoadRender = timestamp;
                    renderSequenceStatus();
                }

                roadAnimationFrame = requestAnimationFrame(frame);
            }

            function stopRoadAnimation() {
                if (roadAnimationFrame) {
                    cancelAnimationFrame(roadAnimationFrame);
                    roadAnimationFrame = null;
                }
            }

            function restartSequenceIfListening() {
                if (stopButton.disabled) {
                    return;
                }

                startRoadAnimation();

                if (
                    isSequenceMode() &&
                    getTargetWords().length &&
                    !deadline &&
                    !sequenceFailed
                ) {
                    startSequenceTimer();
                }
            }

            function escapeRegExp(text) {
                return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function getTargetWords() {
                return wordsInput.value
                    .split("\n")
                    .map((word) => word.trim())
                    .filter(Boolean);
            }

            function renderWordList() {
                const words = getTargetWords();
                wordList.innerHTML = "";

                for (const [index, word] of words.entries()) {
                    const normalized = word.toLowerCase();
                    const item = document.createElement("li");
                    const isChecked = caughtWords.has(normalized);
                    const isCurrent =
                        isSequenceMode() &&
                        index === sequenceIndex &&
                        !sequenceFailed;
                    item.className = [
                        isChecked ? "checked" : "",
                        isCurrent ? "current" : "",
                        sequenceFailed &&
                        isSequenceMode() &&
                        index === sequenceIndex
                            ? "failed"
                            : "",
                    ]
                        .filter(Boolean)
                        .join(" ");
                    item.innerHTML = `<input type="checkbox" disabled ${caughtWords.has(normalized) ? "checked" : ""}> <span></span>`;
                    item.querySelector("span").textContent =
                        `${isCurrent ? "> " : "  "}${word}`;
                    wordList.append(item);
                }
            }

            function renderTranscript() {
                const text = getSelectedTranscriptText();
                const words = getTargetWords();
                interimText.textContent = "";
                finalText.replaceChildren();

                if (!text || !words.length) {
                    finalText.textContent = text;
                    return;
                }

                // Longest first so multi-word phrases win over their prefixes.
                const matcher = new RegExp(
                    `\\b(?:${words
                        .slice()
                        .sort((a, b) => b.length - a.length)
                        .map(escapeRegExp)
                        .join("|")})\\b`,
                    "gi",
                );
                let last = 0;

                for (const match of text.matchAll(matcher)) {
                    if (match.index > last) {
                        finalText.append(text.slice(last, match.index));
                    }

                    finalText.append(colorSpan("hit", match[0]));
                    last = match.index + match[0].length;
                }

                finalText.append(text.slice(last));
            }

            function getSelectedTranscriptText() {
                return transcriptSourceInput.value === "interim"
                    ? interimTranscript
                    : finalChunks.join(" ");
            }

            function catchWords(text) {
                for (const word of getTargetWords()) {
                    const matcher = new RegExp(
                        `\\b${escapeRegExp(word)}\\b`,
                        "i",
                    );

                    if (matcher.test(text)) {
                        caughtWords.add(word.toLowerCase());
                    }
                }
            }

            function getSecondsLimit() {
                return Math.max(1, Number(secondsInput.value) || 5);
            }

            function getLivesLimit() {
                return Math.max(1, Number(livesInput.value) || 3);
            }

            function getRetriesLimit() {
                return Math.max(0, Number(retriesInput.value) || 0);
            }

            function isSequenceMode() {
                return modeInput.value !== "catch";
            }

            function isBeatMode() {
                return (
                    modeInput.value === "rhythm" ||
                    modeInput.value === "lives"
                );
            }

            function textHasWord(text, word) {
                return new RegExp(`\\b${escapeRegExp(word)}\\b`, "i").test(
                    text,
                );
            }

            function findWordEnd(text, word, fromIndex) {
                const matcher = new RegExp(
                    `\\b${escapeRegExp(word)}\\b`,
                    "gi",
                );
                matcher.lastIndex = fromIndex;
                const match = matcher.exec(text);
                return match ? match.index + match[0].length : -1;
            }

            function stopSequenceTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }

            function resetSequence() {
                sequenceIndex = 0;
                sequenceFailed = false;
                failReason = "timeout";
                deadline = null;
                livesLeft = getLivesLimit();
                retriesLeft = getRetriesLimit();
                wordCaughtThisBeat = false;
                gateOpenedAt = 0;
                caughtWords.clear();

                if (modeInput.value === "catch") {
                    catchWords(getSelectedTranscriptText());
                }

                stopSequenceTimer();
                renderSequenceStatus();
                renderWordList();
            }

            function failSequence(reason) {
                sequenceFailed = true;
                failReason = reason || "timeout";
                deadline = null;
                stopSequenceTimer();
                renderSequenceStatus();
                renderWordList();
            }

            function completeSequence() {
                deadline = null;
                stopSequenceTimer();
                renderSequenceStatus();
                renderWordList();
            }

            function handleDeadline() {
                if (!isBeatMode()) {
                    failSequence();
                    return;
                }

                if (wordCaughtThisBeat) {
                    sequenceIndex += 1;
                    wordCaughtThisBeat = false;
                    gateOpenedAt = 0;
                    retriesLeft = getRetriesLimit();

                    if (sequenceIndex >= getTargetWords().length) {
                        completeSequence();
                        return;
                    }

                    // Anchor the next deadline to the previous one so the
                    // beat stays fixed instead of drifting with the timer.
                    deadline += getSecondsLimit() * 1000;
                    wallEchoFiredThisBeat = false;
                    maybeTriggerEcho("beat");
                    renderSequenceStatus();
                    renderWordList();
                    return;
                }

                if (modeInput.value === "rhythm") {
                    failSequence("missed the beat");
                    return;
                }

                // Lives mode: a missed beat costs a life.
                livesLeft -= 1;

                if (livesLeft <= 0) {
                    failSequence("out of lives");
                    return;
                }

                if (retriesLeft > 0) {
                    retriesLeft -= 1;
                } else {
                    sequenceIndex += 1;
                    retriesLeft = getRetriesLimit();

                    if (sequenceIndex >= getTargetWords().length) {
                        completeSequence();
                        return;
                    }
                }

                deadline += getSecondsLimit() * 1000;
                wallEchoFiredThisBeat = false;
                maybeTriggerEcho("life");
                renderSequenceStatus();
                renderWordList();
            }

            function startSequenceTimer() {
                stopSequenceTimer();
                deadline = Date.now() + getSecondsLimit() * 1000;
                wallEchoFiredThisBeat = false;
                timerInterval = setInterval(() => {
                    if (deadline && Date.now() >= deadline) {
                        handleDeadline();
                        return;
                    }

                    if (
                        deadline &&
                        !wallEchoFiredThisBeat &&
                        (deadline - Date.now()) / 1000 <= getSecondsLimit() / 2
                    ) {
                        wallEchoFiredThisBeat = true;
                        maybeTriggerEcho("wall");
                    }

                    renderSequenceStatus();
                }, 100);
                renderSequenceStatus();
            }

            function renderSequenceStatus() {
                const words = getTargetWords();
                renderTimeline(words);

                if (!isSequenceMode()) {
                    sequenceStatus.textContent = "sequence: off";
                    return;
                }

                if (!words.length) {
                    sequenceStatus.textContent = "sequence: no words";
                    return;
                }

                if (sequenceFailed) {
                    sequenceStatus.textContent = `sequence: ${failReason}\nexpected: ${words[sequenceIndex] || "done"}\npress reset seq`;
                    return;
                }

                if (sequenceIndex >= words.length) {
                    sequenceStatus.textContent =
                        "sequence: complete\nall words spoken";
                    return;
                }

                if (!deadline) {
                    sequenceStatus.textContent = `sequence: armed\nspeak first: ${words[sequenceIndex]}`;
                    return;
                }

                const remaining = Math.max(0, (deadline - Date.now()) / 1000);
                let extra = "";

                if (wordCaughtThisBeat) {
                    extra = "\ncaught — gate open!";
                }

                if (modeInput.value === "lives") {
                    extra += `\nlives: ${livesLeft} retries: ${retriesLeft}`;
                }

                sequenceStatus.textContent = `sequence: running\nnext: ${words[sequenceIndex]}\ntime: ${remaining.toFixed(1)}s${extra}`;
            }

            function colorSpan(className, text) {
                const span = document.createElement("span");
                span.className = className;
                span.textContent = text;
                return span;
            }

            function hashCell(row, col) {
                let h =
                    Math.imul(row, 374761393) + Math.imul(col, 668265263);
                h = Math.imul(h ^ (h >>> 13), 1274126177);
                return (h ^ (h >>> 16)) >>> 0;
            }

            const PLANT_CHARS = [".", ",", "'", '"', "*", "v", "w"];
            const SPARKLE_CHARS = ["*", "+", "'", ".", "o"];
            const GATE_ANIM_MS = 900;

            function groundProp(worldRow, col) {
                const h = hashCell(worldRow, col);

                if (h % 211 === 0) {
                    return "|";
                }

                // Canopy over a trunk one row further down the road.
                for (let dc = -1; dc <= 1; dc += 1) {
                    if (hashCell(worldRow + 1, col + dc) % 211 === 0) {
                        return "*";
                    }
                }

                if (h % 29 === 0) {
                    return PLANT_CHARS[(h >>> 8) % PLANT_CHARS.length];
                }

                return " ";
            }

            function renderRoad(word, wallRow, gateProgress = null) {
                const { laneLeft, laneRight } = getRoadMetrics();
                const rows = buildRoad(word, wallRow, gateProgress);
                const fragment = document.createDocumentFragment();
                const tick = Math.floor(Date.now() / 120);

                rows.forEach((row, r) => {
                    const mid = row.slice(laneLeft - 1, laneRight + 2);
                    const isGateRow =
                        word &&
                        gateProgress !== null &&
                        r >= wallRow &&
                        r <= wallRow + 2;

                    fragment.append(
                        colorSpan("ground", row.slice(0, laneLeft - 1)),
                        isGateRow
                            ? colorSpan(`gate-${(tick + r) % 4}`, mid)
                            : document.createTextNode(mid),
                        colorSpan("ground", row.slice(laneRight + 2)),
                        document.createTextNode("\n"),
                    );
                });

                timeline.replaceChildren(fragment);
            }

            function renderLivesDisplay() {
                if (modeInput.value !== "lives") {
                    livesDisplay.replaceChildren();
                    return;
                }

                const lost = Math.max(0, getLivesLimit() - livesLeft);
                livesDisplay.replaceChildren(
                    colorSpan(
                        "hearts",
                        "♥".repeat(livesLeft) + "♡".repeat(lost),
                    ),
                    document.createTextNode(" "),
                    colorSpan("retries", `RETRIES ×${retriesLeft}`),
                );
            }

            function buildRoad(word, wallRow, gateProgress = null) {
                const {
                    width,
                    height,
                    laneLeft,
                    laneRight,
                    carCol,
                    carRow,
                } = getRoadMetrics();
                const rows = [];
                const scroll = Math.floor(Date.now() / 400);

                for (let r = 0; r < height; r += 1) {
                    const row = Array(width).fill(" ");
                    // World coordinate fixed to the scenery, so props and
                    // dashes stream downward past the car as scroll grows.
                    const worldRow = r - scroll;

                    for (let c = 0; c < width; c += 1) {
                        if (c < laneLeft - 2 || c > laneRight + 2) {
                            row[c] = groundProp(worldRow, c);
                        }
                    }

                    row[laneLeft - 1] = "|";
                    row[laneRight + 1] = "|";

                    if (((worldRow % 4) + 4) % 4 < 2) {
                        row[Math.floor((laneLeft + laneRight) / 2)] = ":";
                    }

                    if (word && r === wallRow) {
                        for (let c = laneLeft; c <= laneRight; c += 1) {
                            row[c] = "#";
                        }
                    }

                    if (word && r === wallRow + 1) {
                        const label = word.toUpperCase();
                        const start = Math.max(
                            laneLeft,
                            Math.floor(
                                (laneLeft + laneRight - label.length) / 2,
                            ),
                        );

                        for (let c = laneLeft; c <= laneRight; c += 1) {
                            row[c] = "=";
                        }

                        for (
                            let i = 0;
                            i < label.length && start + i <= laneRight;
                            i += 1
                        ) {
                            row[start + i] = label[i];
                        }
                    }

                    if (word && r === wallRow + 2) {
                        for (let c = laneLeft; c <= laneRight; c += 1) {
                            row[c] = "#";
                        }
                    }

                    // Gate opening: the wall splits from the center with a
                    // burst of sparkles, leaving the road clear once open.
                    if (
                        word &&
                        gateProgress !== null &&
                        r >= wallRow &&
                        r <= wallRow + 2
                    ) {
                        const center = Math.floor((laneLeft + laneRight) / 2);
                        const gap = Math.ceil(
                            (gateProgress * (laneRight - laneLeft + 2)) / 2,
                        );
                        const tick = Math.floor(Date.now() / 120);

                        for (let c = laneLeft; c <= laneRight; c += 1) {
                            if (Math.abs(c - center) >= gap) {
                                continue;
                            }

                            const h = hashCell(c * 31 + r, tick);
                            row[c] =
                                gateProgress < 1 && h % 3 === 0
                                    ? SPARKLE_CHARS[
                                          (h >>> 8) % SPARKLE_CHARS.length
                                      ]
                                    : " ";
                        }
                    }

                    if (r === carRow - 1) {
                        row[carCol] = "/";
                        row[carCol + 1] = "~";
                        row[carCol + 2] = "^";
                        row[carCol + 3] = "~";
                        row[carCol + 4] = "\\";
                    }

                    if (r === carRow) {
                        const car = [" ", "[", "=", "=", "=", "]", " "];
                        for (let i = 0; i < car.length; i += 1) {
                            row[carCol - 1 + i] = car[i];
                        }
                    }

                    if (r === carRow + 1) {
                        row[carCol + 1] = "O";
                        row[carCol + 3] = "O";
                    }

                    rows.push(row.join(""));
                }

                return rows;
            }

            function renderTimeline(words = getTargetWords()) {
                renderLivesDisplay();

                if (!isSequenceMode()) {
                    timelineState.textContent = "mode: catch";
                    timerDisplay.textContent = "--.-";
                    renderRoad(null, -10);
                    return;
                }

                const limit = getSecondsLimit();
                const remaining = deadline
                    ? Math.max(0, (deadline - Date.now()) / 1000)
                    : limit;
                const elapsed = deadline
                    ? Math.min(limit, limit - remaining)
                    : 0;
                const { carRow } = getRoadMetrics();
                const wallRow = Math.round(-3 + (elapsed / limit) * (carRow - 1));
                const activeWord = words[sequenceIndex] || "--";
                const complete =
                    sequenceIndex >= words.length && words.length > 0;

                timelineState.textContent = `mode: ${modeInput.value} ${sequenceIndex}/${words.length}`;

                if (!words.length) {
                    timerDisplay.textContent = "--.-";
                    renderRoad(null, -10);
                    return;
                }

                if (sequenceFailed) {
                    timerDisplay.textContent = "00.0";
                    renderRoad(activeWord, carRow - 2);
                    return;
                }

                if (complete) {
                    timerDisplay.textContent = "DONE";
                    renderRoad(null, -10);
                    return;
                }

                timerDisplay.textContent = deadline
                    ? (wordCaughtThisBeat ? "✓ " : "") + remaining.toFixed(1)
                    : `${limit}.0`;

                // A caught word bursts the gate open while the beat finishes.
                renderRoad(
                    activeWord,
                    wallRow,
                    isBeatMode() && wordCaughtThisBeat
                        ? Math.min(
                              1,
                              (Date.now() - gateOpenedAt) / GATE_ANIM_MS,
                          )
                        : null,
                );
            }

            function processSequenceText(text) {
                if (!isSequenceMode() || sequenceFailed) {
                    return false;
                }

                const words = getTargetWords();
                let changed = false;

                // Re-anchor past the already-matched words so an upcoming
                // word spoken earlier in the transcript cannot count.
                let searchFrom = 0;
                for (let i = 0; i < sequenceIndex; i += 1) {
                    const end = findWordEnd(text, words[i], searchFrom);
                    if (end !== -1) {
                        searchFrom = end;
                    }
                }

                // On a beat mode a caught word waits for the deadline
                // to advance instead of jumping forward immediately.
                if (isBeatMode()) {
                    if (
                        !wordCaughtThisBeat &&
                        sequenceIndex < words.length &&
                        findWordEnd(text, words[sequenceIndex], searchFrom) !==
                            -1
                    ) {
                        wordCaughtThisBeat = true;
                        gateOpenedAt = Date.now();
                        caughtWords.add(words[sequenceIndex].toLowerCase());
                        changed = true;
                    }

                    renderSequenceStatus();
                    return changed;
                }

                while (sequenceIndex < words.length) {
                    const end = findWordEnd(
                        text,
                        words[sequenceIndex],
                        searchFrom,
                    );

                    if (end === -1) {
                        break;
                    }

                    searchFrom = end;
                    caughtWords.add(words[sequenceIndex].toLowerCase());
                    sequenceIndex += 1;
                    changed = true;

                    if (sequenceIndex >= words.length) {
                        deadline = null;
                        stopSequenceTimer();
                        break;
                    }

                    startSequenceTimer();
                }

                renderSequenceStatus();
                return changed;
            }

            function processTranscriptText(text) {
                if (!text.trim()) {
                    return;
                }

                if (isSequenceMode()) {
                    processSequenceText(text);
                } else {
                    catchWords(text);
                }
            }

            function rebuildCatchWordsFromSource() {
                caughtWords.clear();

                if (transcriptSourceInput.value === "interim") {
                    catchWords(interimTranscript);
                    return;
                }

                for (const chunk of finalChunks) {
                    catchWords(chunk);
                }
            }

            function drawIdleVisualizer() {
                const width = visualizer.width;
                const height = visualizer.height;
                canvas.clearRect(0, 0, width, height);
                canvas.fillStyle = "#666666";
                canvas.font = "16px monospace";
                canvas.fillText(
                    "---- ---- ---- ---- ---- ---- ---- ---- ---- ---- ---- ----",
                    18,
                    height / 2 + 5,
                );
            }

            async function startVisualizer() {
                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {
                    return;
                }

                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                });
                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                const source = audioContext.createMediaStreamSource(micStream);
                source.connect(analyser);

                const data = new Uint8Array(analyser.frequencyBinCount);
                const width = visualizer.width;
                const height = visualizer.height;
                const columns = 48;
                const rows = 6;
                const cellWidth = width / columns;
                const cellHeight = height / (rows + 1);
                const rowColors = [
                    "#333333",
                    "#666666",
                    "#aaaaaa",
                    "#facc15",
                    "#facc15",
                    "#ef4444",
                ];

                function draw() {
                    visualizerFrame = requestAnimationFrame(draw);
                    analyser.getByteFrequencyData(data);
                    canvas.clearRect(0, 0, width, height);
                    canvas.font = "14px monospace";

                    for (let column = 0; column < columns; column += 1) {
                        const start = Math.floor(
                            (column / columns) * data.length,
                        );
                        const end = Math.floor(
                            ((column + 1) / columns) * data.length,
                        );
                        let total = 0;

                        for (
                            let i = start;
                            i < Math.max(end, start + 1);
                            i += 1
                        ) {
                            total += data[i];
                        }

                        const average = total / Math.max(1, end - start);
                        const activeRows = Math.max(
                            1,
                            Math.round((average / 255) * rows),
                        );

                        for (let row = 0; row < activeRows; row += 1) {
                            const x = column * cellWidth + 8;
                            const y = height - row * cellHeight - 14;
                            canvas.fillStyle =
                                rowColors[Math.min(row, rowColors.length - 1)];
                            canvas.fillText(
                                row === activeRows - 1 ? "+" : "#",
                                x,
                                y,
                            );
                        }
                    }
                }

                draw();
            }

            function stopVisualizer() {
                if (visualizerFrame) {
                    cancelAnimationFrame(visualizerFrame);
                    visualizerFrame = null;
                }

                if (micStream) {
                    for (const track of micStream.getTracks()) {
                        track.stop();
                    }
                    micStream = null;
                }

                if (audioContext) {
                    audioContext.close();
                    audioContext = null;
                }

                analyser = null;
                drawIdleVisualizer();
            }

            const ECHO_MIME =
                window.MediaRecorder &&
                MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
                    ? "audio/webm;codecs=opus"
                    : "";
            const ECHO_GAIN = 0.85;
            const ECHO_PREROLL_MS = 600;
            const ECHO_COOLDOWN_MS = 4000;
            const ECHO_PROGRESS_BOOST = 1.5;
            const ECHO_COOLDOWN_FLOOR = 0.4;
            const ECHO_DELAY_TIME = 0.3;
            const ECHO_REVERB_SECONDS = 2.6;
            const ECHO_MIN_MS = 400;
            const ECHO_MAX_MS = 8000;
            const ECHO_MIN_RMS = 0.01;
            const ECHO_TRIM_RMS = 0.02;
            const ECHO_TRIM_PAD_MS = 60;
            const ECHO_WAVE_BUCKETS = 40;
            const ECHO_P = { beat: 0.35, wall: 0.5, life: 1, random: 0.25 };

            function echoEnabled() {
                return echoModeInput.value !== "off";
            }

            function echoAllows(kind) {
                if (echoModeInput.value === "both") {
                    return true;
                }

                if (echoModeInput.value === "random") {
                    return kind === "random";
                }

                if (echoModeInput.value === "key") {
                    return kind !== "random";
                }

                return false;
            }

            function startEchoSystem() {
                if (!echoEnabled() || !micStream || !window.MediaRecorder) {
                    return;
                }

                echoPanel.classList.add("visible");
                startEchoSegment();

                if (!echoRandomInterval) {
                    echoRandomInterval = setInterval(() => {
                        if (
                            echoRecorder &&
                            Date.now() - echoRecorderStartedAt > ECHO_MAX_MS
                        ) {
                            cutEchoSnippet(
                                interimTranscript
                                    .split(" ")
                                    .slice(-6)
                                    .join(" ") || "…",
                            );
                        }

                        maybeTriggerEcho("random");
                        renderEchoPanel();
                    }, 5000);
                }

                renderEchoPanel();
            }

            function stopEchoSystem() {
                cancelActiveEchoes();

                if (echoBus) {
                    try {
                        echoBus.master.disconnect();
                    } catch (error) {
                        // context already closed
                    }

                    echoBus = null;
                }

                if (echoRandomInterval) {
                    clearInterval(echoRandomInterval);
                    echoRandomInterval = null;
                }

                if (echoRecorder) {
                    echoRecorder._echoDiscard = true;

                    if (echoRecorder.state === "recording") {
                        try {
                            echoRecorder.stop();
                        } catch (error) {
                            // already inactive
                        }
                    }

                    echoRecorder = null;
                }

                echoPanel.classList.remove("visible");
                renderEchoPanel();
            }

            function startEchoSegment() {
                if (!micStream || !echoEnabled() || !window.MediaRecorder) {
                    return;
                }

                // A fresh recorder per segment: each onstop closure owns its
                // own chunks, so a finishing segment can never race the next.
                const chunks = [];
                const startedAt = Date.now();
                const recorder = new MediaRecorder(
                    micStream,
                    ECHO_MIME ? { mimeType: ECHO_MIME } : undefined,
                );

                recorder.ondataavailable = (event) => {
                    if (event.data && event.data.size) {
                        chunks.push(event.data);
                    }
                };

                recorder.onstop = () => {
                    if (recorder._echoDiscard || !audioContext) {
                        return;
                    }

                    finalizeEchoSegment(
                        new Blob(chunks, ECHO_MIME ? { type: ECHO_MIME } : {}),
                        recorder._echoLabel || "…",
                        Date.now() - startedAt,
                    );
                };

                try {
                    recorder.start();
                } catch (error) {
                    return;
                }

                echoRecorder = recorder;
                echoRecorderStartedAt = startedAt;
            }

            function cutEchoSnippet(label) {
                if (!echoRecorder || echoRecorder.state !== "recording") {
                    return;
                }

                echoRecorder._echoLabel = label;
                echoRecorder.stop();
                echoRecorder = null;
                startEchoSegment();
            }

            async function finalizeEchoSegment(blob, label, durationMs) {
                if (durationMs < ECHO_MIN_MS || !blob.size) {
                    return;
                }

                let buffer;

                try {
                    const bytes = await blob.arrayBuffer();

                    if (!audioContext) {
                        return;
                    }

                    buffer = await audioContext.decodeAudioData(bytes);
                } catch (error) {
                    return;
                }

                if (!audioContext) {
                    return;
                }

                buffer = trimSilence(buffer);

                if (
                    !buffer ||
                    buffer.duration * 1000 < ECHO_MIN_MS ||
                    computeRms(buffer) < ECHO_MIN_RMS
                ) {
                    return;
                }

                echoIdCounter += 1;
                echoSnippets.push({
                    id: echoIdCounter,
                    label,
                    buffer,
                    peaks: computePeaks(buffer),
                    state: "idle",
                });

                renderEchoPanel();
            }

            function trimSilence(buffer) {
                const data = buffer.getChannelData(0);
                const windowSize = 1024;
                let firstLoud = -1;
                let lastLoud = -1;

                for (let start = 0; start < data.length; start += windowSize) {
                    const end = Math.min(data.length, start + windowSize);
                    let total = 0;
                    let count = 0;

                    for (let i = start; i < end; i += 4) {
                        total += data[i] * data[i];
                        count += 1;
                    }

                    const rms = Math.sqrt(total / Math.max(1, count));

                    if (rms >= ECHO_TRIM_RMS) {
                        if (firstLoud === -1) {
                            firstLoud = start;
                        }

                        lastLoud = end;
                    }
                }

                if (firstLoud === -1) {
                    return null;
                }

                const pad = Math.round(
                    (ECHO_TRIM_PAD_MS / 1000) * buffer.sampleRate,
                );
                const from = Math.max(0, firstLoud - pad);
                const to = Math.min(data.length, lastLoud + pad);

                if (from === 0 && to === data.length) {
                    return buffer;
                }

                const trimmed = audioContext.createBuffer(
                    buffer.numberOfChannels,
                    to - from,
                    buffer.sampleRate,
                );

                for (
                    let channel = 0;
                    channel < buffer.numberOfChannels;
                    channel += 1
                ) {
                    trimmed.copyToChannel(
                        buffer.getChannelData(channel).subarray(from, to),
                        channel,
                    );
                }

                return trimmed;
            }

            function computeRms(buffer) {
                const data = buffer.getChannelData(0);
                let total = 0;
                let count = 0;

                for (let i = 0; i < data.length; i += 32) {
                    total += data[i] * data[i];
                    count += 1;
                }

                return Math.sqrt(total / Math.max(1, count));
            }

            function computePeaks(buffer) {
                const data = buffer.getChannelData(0);
                const peaks = [];
                const step =
                    Math.floor(data.length / ECHO_WAVE_BUCKETS) || 1;

                for (let b = 0; b < ECHO_WAVE_BUCKETS; b += 1) {
                    let max = 0;

                    for (
                        let i = b * step;
                        i < (b + 1) * step && i < data.length;
                        i += 16
                    ) {
                        max = Math.max(max, Math.abs(data[i]));
                    }

                    peaks.push(max);
                }

                return peaks;
            }

            function drawSnippetWave(canvasEl, peaks, color) {
                const context = canvasEl.getContext("2d");
                const width = canvasEl.width;
                const height = canvasEl.height;
                const barWidth = width / peaks.length;
                context.clearRect(0, 0, width, height);
                context.fillStyle = color;

                for (const [i, peak] of peaks.entries()) {
                    const barHeight = Math.max(1, peak * height);
                    context.fillRect(
                        i * barWidth,
                        (height - barHeight) / 2,
                        Math.max(1, barWidth - 1),
                        barHeight,
                    );
                }
            }

            function renderEchoPanel() {
                const progress = getEchoProgress();
                echoHeader.textContent =
                    progress > 0
                        ? `[ echo ] fx ${Math.round(progress * 100)}%`
                        : "[ echo ]";
                echoRows.replaceChildren();

                if (echoRecorder) {
                    const recRow = document.createElement("div");
                    recRow.className = "echo-row";
                    recRow.append(
                        colorSpan("echo-badge rec", "● REC"),
                        colorSpan("echo-label", "listening to you…"),
                    );
                    echoRows.append(recRow);
                }

                const visible = echoSnippets.slice().reverse();

                for (const snippet of visible) {
                    const row = document.createElement("div");
                    row.className = "echo-row";

                    const wave = document.createElement("canvas");
                    wave.width = 64;
                    wave.height = 16;
                    drawSnippetWave(
                        wave,
                        snippet.peaks,
                        snippet.state === "idle" ? "#666666" : "#facc15",
                    );

                    const rateLabel = snippet.rate
                        ? ` ×${snippet.rate.toFixed(2)}`
                        : "";
                    const badge =
                        snippet.state === "initiating"
                            ? colorSpan("echo-badge init", `INIT${rateLabel}`)
                            : snippet.state === "playing"
                              ? colorSpan("echo-badge play", `▶${rateLabel}`)
                              : colorSpan(
                                    "echo-badge muted",
                                    `${snippet.buffer.duration.toFixed(1)}s`,
                                );

                    row.append(
                        wave,
                        colorSpan("echo-label", snippet.label),
                        badge,
                    );
                    echoRows.append(row);
                }
            }

            function getEchoProgress() {
                const words = getTargetWords();

                if (!words.length) {
                    return 0;
                }

                if (isSequenceMode()) {
                    return Math.min(1, sequenceIndex / words.length);
                }

                return Math.min(1, caughtWords.size / words.length);
            }

            function buildReverbImpulse() {
                const sampleRate = audioContext.sampleRate;
                const length = Math.round(
                    sampleRate * ECHO_REVERB_SECONDS,
                );
                const impulse = audioContext.createBuffer(
                    2,
                    length,
                    sampleRate,
                );

                for (let channel = 0; channel < 2; channel += 1) {
                    const data = impulse.getChannelData(channel);

                    for (let i = 0; i < length; i += 1) {
                        data[i] =
                            (Math.random() * 2 - 1) *
                            Math.pow(1 - i / length, 2.8);
                    }
                }

                return impulse;
            }

            // Persistent send/return effect bus: sources come and go, the
            // delay and reverb stay alive, so tails ring out naturally and
            // overlapping snippets share the same space.
            function ensureEchoBus() {
                if (echoBus || !audioContext) {
                    return echoBus;
                }

                const input = audioContext.createGain();
                const dry = audioContext.createGain();
                const delay = audioContext.createDelay(2);
                const delayFeedback = audioContext.createGain();
                const delaySend = audioContext.createGain();
                const delayWet = audioContext.createGain();
                const reverb = audioContext.createConvolver();
                const reverbSend = audioContext.createGain();
                const reverbWet = audioContext.createGain();
                const master = audioContext.createGain();

                reverb.buffer = buildReverbImpulse();
                delay.delayTime.value = ECHO_DELAY_TIME;

                input.connect(dry);
                dry.connect(master);

                input.connect(delaySend);
                delaySend.connect(delay);
                delay.connect(delayFeedback);
                delayFeedback.connect(delay);
                delay.connect(delayWet);
                delayWet.connect(master);

                input.connect(reverbSend);
                // Delay repeats also feed the reverb, so late echoes drift
                // into the same space instead of staying dry.
                delay.connect(reverbSend);
                reverbSend.connect(reverb);
                reverb.connect(reverbWet);
                reverbWet.connect(master);

                dry.gain.value = 1;
                delaySend.gain.value = 0;
                delayFeedback.gain.value = 0.25;
                delayWet.gain.value = 0.9;
                reverbSend.gain.value = 0;
                reverbWet.gain.value = 1;
                master.gain.value = ECHO_GAIN;

                master.connect(audioContext.destination);

                echoBus = {
                    input,
                    dry,
                    delaySend,
                    delayFeedback,
                    reverbSend,
                    master,
                };
                return echoBus;
            }

            function updateEchoBus(progress) {
                const bus = ensureEchoBus();

                if (!bus) {
                    return;
                }

                // Ramp smoothly so ringing tails morph instead of clicking.
                const now = audioContext.currentTime;
                bus.dry.gain.setTargetAtTime(1 - progress * 0.35, now, 0.2);
                bus.delaySend.gain.setTargetAtTime(progress * 0.7, now, 0.2);
                bus.delayFeedback.gain.setTargetAtTime(
                    0.25 + progress * 0.35,
                    now,
                    0.2,
                );
                bus.reverbSend.gain.setTargetAtTime(progress * 0.8, now, 0.2);
            }

            function maybeTriggerEcho(kind) {
                const progress = getEchoProgress();
                const cooldown =
                    ECHO_COOLDOWN_MS *
                    (1 - (1 - ECHO_COOLDOWN_FLOOR) * progress);

                if (
                    !micStream ||
                    !echoEnabled() ||
                    !echoAllows(kind) ||
                    !echoSnippets.length ||
                    Date.now() - lastEchoAt < cooldown
                ) {
                    return;
                }

                const chance = Math.min(
                    1,
                    (ECHO_P[kind] || 0) *
                        (1 + ECHO_PROGRESS_BOOST * progress),
                );

                if (Math.random() >= chance) {
                    return;
                }

                initiateEcho(pickEchoSnippet());
            }

            function pickEchoSnippet() {
                const words = getTargetWords();
                const currentWord =
                    isSequenceMode() && !sequenceFailed
                        ? words[sequenceIndex]
                        : null;
                const idle = echoSnippets.filter(
                    (snippet) => snippet.state === "idle",
                );
                // Avoid snippets containing the current target word, so an
                // echo cannot accidentally open the gate for the player.
                // Residual playback leak into recognition is an accepted
                // prototype limitation (AEC suppresses most of it).
                const safe = currentWord
                    ? idle.filter(
                          (snippet) =>
                              !textHasWord(snippet.label, currentWord),
                      )
                    : idle;
                const pool = safe.length ? safe : idle;

                return pool[Math.floor(Math.random() * pool.length)] || null;
            }

            function pickEchoRate() {
                // Speed/pitch shift in two bands away from 1.0, so the
                // playback always sounds clearly machine-altered.
                return Math.random() < 0.5
                    ? 0.7 + Math.random() * 0.15
                    : 1.15 + Math.random() * 0.25;
            }

            function initiateEcho(snippet) {
                if (!snippet) {
                    return;
                }

                lastEchoAt = Date.now();
                snippet.rate = pickEchoRate();
                snippet.state = "initiating";

                const entry = { snippet, source: null, prerollTimer: null };
                entry.prerollTimer = setTimeout(() => {
                    entry.prerollTimer = null;
                    playEcho(entry);
                }, ECHO_PREROLL_MS);
                activeEchoes.add(entry);
                renderEchoPanel();
            }

            function playEcho(entry) {
                const snippet = entry.snippet;
                const bus = ensureEchoBus();

                if (!audioContext || !bus) {
                    activeEchoes.delete(entry);
                    snippet.state = "idle";
                    renderEchoPanel();
                    return;
                }

                audioContext.resume();
                updateEchoBus(getEchoProgress());

                const source = audioContext.createBufferSource();
                source.buffer = snippet.buffer;
                source.playbackRate.value = snippet.rate || 1;
                source.connect(bus.input);

                source.onended = () => {
                    // Only the source ends here — the reverb/delay tails
                    // keep ringing on the shared bus.
                    activeEchoes.delete(entry);
                    snippet.state = "idle";
                    renderEchoPanel();
                };

                snippet.state = "playing";
                entry.source = source;
                source.start();
                renderEchoPanel();
            }

            function cancelActiveEchoes() {
                for (const entry of activeEchoes) {
                    if (entry.prerollTimer) {
                        clearTimeout(entry.prerollTimer);
                    }

                    if (entry.source) {
                        entry.source.onended = null;

                        try {
                            entry.source.stop();
                        } catch (error) {
                            // already stopped
                        }
                    }

                    entry.snippet.state = "idle";
                }

                activeEchoes.clear();
                renderEchoPanel();
            }

            function clearEchoSnippets() {
                cancelActiveEchoes();
                echoSnippets.length = 0;
                renderEchoPanel();
            }

            wordsInput.addEventListener("input", () => {
                resetSequence();
                if (modeInput.value === "catch") {
                    rebuildCatchWordsFromSource();
                }
                renderWordList();
                renderTranscript();
                restartSequenceIfListening();
            });

            modeInput.addEventListener("change", () => {
                resetSequence();
                renderTranscript();
                restartSequenceIfListening();
            });

            secondsInput.addEventListener("input", () => {
                if (
                    isSequenceMode() &&
                    deadline &&
                    !sequenceFailed
                ) {
                    startSequenceTimer();
                }
                renderSequenceStatus();
            });

            livesInput.addEventListener("input", () => {
                resetSequence();
                restartSequenceIfListening();
            });

            retriesInput.addEventListener("input", () => {
                resetSequence();
                restartSequenceIfListening();
            });

            transcriptSourceInput.addEventListener("change", () => {
                resetSequence();
                processTranscriptText(getSelectedTranscriptText());

                renderTranscript();
                renderWordList();
            });

            echoModeInput.addEventListener("change", () => {
                if (!echoEnabled()) {
                    stopEchoSystem();
                    return;
                }

                if (micStream && !echoRecorder) {
                    startEchoSystem();
                }
            });

            resetSequenceButton.addEventListener("click", () => {
                resetSequence();
                restartSequenceIfListening();
            });

            openSettingsButton.addEventListener("click", openSettings);
            closeSettingsButton.addEventListener("click", closeSettings);
            settingsBackdrop.addEventListener("click", closeSettings);
            window.addEventListener("resize", () => {
                renderSequenceStatus();
            });

            renderWordList();
            renderSequenceStatus();
            drawIdleVisualizer();

            if (!SpeechRecognition) {
                status.textContent =
                    "Speech recognition is not supported in this browser. Try Chrome or Edge.";
                startButton.disabled = true;
            } else {
                const recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = navigator.language || "en-US";

                recognition.onstart = () => {
                    status.textContent = "Listening...";
                    startButton.disabled = true;
                    stopButton.disabled = false;
                    startRoadAnimation();

                    if (
                        isSequenceMode() &&
                        getTargetWords().length &&
                        !deadline &&
                        !sequenceFailed
                    ) {
                        startSequenceTimer();
                    }
                };

                recognition.onend = () => {
                    status.textContent = "Stopped";
                    startButton.disabled = false;
                    stopButton.disabled = true;
                    interimText.textContent = "";
                    stopRoadAnimation();
                    stopEchoSystem();
                    stopVisualizer();
                };

                recognition.onerror = (event) => {
                    status.textContent = `Error: ${event.error}`;
                };

                recognition.onresult = (event) => {
                    const liveResults = [];
                    const newFinals = [];

                    for (
                        let i = event.resultIndex;
                        i < event.results.length;
                        i += 1
                    ) {
                        const text = event.results[i][0].transcript;

                        if (event.results[i].isFinal) {
                            const chunk = text.trim();
                            finalChunks.push(chunk);
                            newFinals.push(chunk);

                            if (transcriptSourceInput.value === "final") {
                                processTranscriptText(chunk);
                            }
                        }
                    }

                    // A final result marks a natural pause: cut the running
                    // recording there into a labeled echo snippet.
                    if (newFinals.length) {
                        cutEchoSnippet(newFinals.join(" "));
                    }

                    for (const result of event.results) {
                        const text = result[0].transcript.trim();

                        if (text) {
                            liveResults.push(text);
                        }
                    }

                    interimTranscript = liveResults.join(" ");

                    if (transcriptSourceInput.value === "interim") {
                        if (modeInput.value === "catch") {
                            rebuildCatchWordsFromSource();
                        } else {
                            processTranscriptText(interimTranscript);
                        }
                    }

                    renderTranscript();
                    renderWordList();
                };

                startButton.addEventListener("click", async () => {
                    try {
                        await startVisualizer();
                        startEchoSystem();
                        recognition.start();
                    } catch (error) {
                        status.textContent =
                            "Microphone access was blocked or unavailable.";
                        stopEchoSystem();
                        stopVisualizer();
                    }
                });
                stopButton.addEventListener("click", () => recognition.stop());
            }

            clearButton.addEventListener("click", () => {
                finalChunks.length = 0;
                interimTranscript = "";
                finalText.textContent = "";
                interimText.textContent = "";
                clearEchoSnippets();
                resetSequence();
                restartSequenceIfListening();
            });
        </script>
    </body>
</html>
